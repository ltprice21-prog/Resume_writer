<title>Global Wine Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (bottom bar on phones) + sticky top bar + one working view; records open in a right-hand drawer. */
:root{
  --bg:#f5f4f3; --surface:#ffffff; --surface-2:#eeebea; --line:#e0dcda; --line-2:#cfc9c7;
  --fg:#1e1a1b; --muted:#6a6264; --faint:#958d8f;
  --accent:#7b1e3a; --accent-fg:#ffffff; --accent-soft:#f3e4e9;
  --ok:#2c7a4b; --ok-soft:#e2f1e7; --warn:#9a5d06; --warn-soft:#fbefd8;
  --bad:#b3261e; --bad-soft:#fbe3e1; --crit:#6f0c0c; --crit-soft:#f4cfcc;
  --info:#2a5ca5; --info-soft:#e3ebf7;
  --shadow:0 12px 40px rgba(40,20,25,.18);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --surface:#1c191a; --surface-2:#262223; --line:#343031; --line-2:#464042;
  --fg:#ede8e9; --muted:#a79ea0; --faint:#7d7577;
  --accent:#d9728f; --accent-fg:#1a0a10; --accent-soft:#3a1f28;
  --ok:#62c088; --ok-soft:#1a3224; --warn:#e3a94d; --warn-soft:#3a2b12;
  --bad:#f07d73; --bad-soft:#3e1d1a; --crit:#ffb0a8; --crit-soft:#5a1a17;
  --info:#7ea9ea; --info-soft:#1b2940; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1c191a; --surface-2:#262223; --line:#343031; --line-2:#464042;
  --fg:#ede8e9; --muted:#a79ea0; --faint:#7d7577;
  --accent:#d9728f; --accent-fg:#1a0a10; --accent-soft:#3a1f28;
  --ok:#62c088; --ok-soft:#1a3224; --warn:#e3a94d; --warn-soft:#3a2b12;
  --bad:#f07d73; --bad-soft:#3e1d1a; --crit:#ffb0a8; --crit-soft:#5a1a17;
  --info:#7ea9ea; --info-soft:#1b2940; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:22px;letter-spacing:-.01em} h2{font-size:16px} h3{font-size:14px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg)}
.brand b{display:block;font-size:13px;line-height:1.15}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav svg{flex:none}
.nav .badge{margin-left:auto}
.rail .sep{height:1px;background:var(--line);margin:8px 6px}
.rail .grow{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.qres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;z-index:40}
.qres button{display:flex;gap:10px;width:100%;padding:9px 12px;border:0;background:none;text-align:left;cursor:pointer;align-items:baseline}
.qres button:hover,.qres button.hi{background:var(--surface-2)}
.me{display:flex;align-items:center;gap:6px;font-size:13px}
.me select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);max-width:170px}
.view{padding-block:20px 60px;padding-inline:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.banner{font-size:12.5px;padding:8px 20px;background:var(--info-soft);color:var(--info);border-bottom:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-variant-numeric:tabular-nums;margin-left:4px;opacity:.75}
input.f,select.f,textarea.f{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0}
textarea.f{resize:vertical;min-height:70px}
input.f.inline,select.f.inline{width:auto;padding:3px 6px;font-size:12.5px}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* status */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-crit{background:var(--crit-soft);color:var(--crit)}
.b-info{background:var(--info-soft);color:var(--info)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
.d-green{background:var(--ok)} .d-amber{background:var(--warn)} .d-red{background:var(--bad)} .d-done{background:var(--faint)}
.sev{border-left:4px solid var(--line-2)}
.sev-Critical{border-left-color:var(--crit)} .sev-High{border-left-color:var(--bad)} .sev-Medium{border-left-color:var(--warn)} .sev-Low{border-left-color:var(--line-2)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.bd{padding:14px 16px}
.panel>.bd.flush{padding:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.tile.t-ok::before{background:var(--ok)} .tile.t-warn::before{background:var(--warn)} .tile.t-bad::before{background:var(--bad)} .tile.t-info::before{background:var(--info)}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--muted)}
.tile.on{outline:2px solid var(--fg)}
.tile:hover{border-color:var(--line-2)}

/* lists */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr:last-child td{border-bottom:0}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .ttl{font-weight:500}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);flex:none;margin-top:2px}
.kind.exc{background:var(--bad-soft);color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.mini{display:flex;gap:2px}
.mini i{width:7px;height:10px;border-radius:2px;background:var(--line)}
.mini i.d{background:var(--ok)} .mini i.c{background:var(--info)} .mini i.cr{background:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.hero-empty{max-width:640px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px}
.hero-empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px;cursor:default}
.bar .trk{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.bar .fill{background:var(--info);height:100%}
.bar .fill.late{background:var(--bad)}
.bar .fill.acc{background:var(--accent)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,10,14,.35);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(820px,100%);background:var(--bg);z-index:60;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer .dh{padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.drawer .db{overflow-y:auto;padding:16px 20px 60px;display:flex;flex-direction:column;gap:14px;flex:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv b{font-weight:500;overflow-wrap:anywhere}
.modal-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(20,10,14,.4)}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:100;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* tracker */
.tracker{display:grid;grid-template-columns:3fr 4fr 2fr 3fr;gap:8px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:4px}
.ph-s{display:flex;gap:4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.st .sd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st.done .sd{background:var(--ok);color:#fff;border-color:var(--ok)}
.st.cur .sd{background:var(--info);color:#fff;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.st.cur.red .sd{background:var(--bad);border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.st .nm{font-size:10.5px;color:var(--muted);line-height:1.15;overflow-wrap:anywhere}
.st.cur .nm{color:var(--fg);font-weight:600}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}
.task .tt{flex:1 1 220px;min-width:0}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.gate{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}
.blockers{font-size:12.5px;color:var(--warn)}
.timeline{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev:last-child{border-bottom:0}
.ev time{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.shipline{display:flex;align-items:flex-start;margin:6px 0 2px}
.shipline .sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:10.5px;color:var(--muted);text-align:center}
.shipline .sp::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.shipline .sp:first-child::before{display:none}
.shipline .sp.on::before{background:var(--ok)}
.shipline .sp i{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);z-index:1}
.shipline .sp.on i{background:var(--ok);border-color:var(--ok)}
.shipline .sp.now i{background:var(--info);border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.shipline .sp.now{color:var(--fg);font-weight:600}
.req{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.req:last-child{border-bottom:0}
.req .cat{flex:none;width:98px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:4px 0}
.hide-sm{} .only-sm{display:none}

@media (max-width: 900px){
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30;overflow-x:auto;gap:0}
  .rail .brand,.rail .sep,.rail .grow,.rail .desk{display:none}
  .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;min-width:64px;align-items:center;position:relative}
  .nav .badge{position:absolute;top:0;right:6px;margin:0;padding:0 5px;font-size:10px}
  .view{padding-inline:16px;padding-bottom:100px}
  .top{padding:10px 16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .tracker{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:100px minmax(0,1fr) 40px}
  .hide-sm{display:none} .only-sm{display:initial}
  .item{flex-wrap:wrap} .item .acts{width:100%;justify-content:flex-start}
  .drawer .dh,.drawer .db{padding-inline:16px}
  .ev{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion: no-preference){
  .drawer{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="main">
    <div id="banner"></div>
    <header class="top">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search orders, POs, AWB / container, customers, suppliers  ( / )" aria-label="Search">
        <div class="qres" id="qres" hidden></div>
      </div>
      <div class="me"><span class="muted hide-sm">I am</span><select id="meSel" aria-label="Who are you"></select></div>
      <button class="btn pri" data-act="new-order" id="newOrderBtn">+ New order</button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============================================================
   Global Wine Operations Hub — single-file operational portal.
   Data lives in this artifact's shared store (db capability) when
   available, otherwise in this browser (local mode). No external
   APIs, no AI calls.
   ============================================================ */

// ---------- reference data ----------
const STAGES = [
  {n:1, name:'PO Intake', phase:'Commit', out:'Order accepted for review', tasks:[
    ['Confirm PO details (customer, destination, dates)',0],['Review pricing against price list',0],
    ['Review quantities and product availability',0],['Review delivery request against lead time',0],['File customer PO in the order folder',0]]},
  {n:2, name:'Order Validation', phase:'Commit', out:'Order approved', tasks:[
    ['Validate commercial terms (Incoterm, currency, payment)',1],['Review account requirements',1],
    ['Review compliance and destination requirements',1],['Approve order',1]]},
  {n:3, name:'Supplier Release', phase:'Commit', out:'Supplier committed', tasks:[
    ['Create supplier PO',1],['Send supplier instructions and account requirements',1],['Confirm supplier acceptance',2]]},
  {n:4, name:'Supply Coordination', phase:'Prepare', out:'Supply secured', tasks:[
    ['Confirm inventory and allocation',2],['Confirm ready date with supplier',2],['Resolve shortages or substitutions',3]]},

async function initStore(){

function loadLocal(){

function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({orders:S.orders, accounts:S.accounts, team:S.team})); } catch(e){ toast('This browser blocked saving. Changes last until you close the page.'); } }
function subscribe(){
  const got = {o:false,a:false,t:false};
  const done = k => { got[k]=true; if(got.o&&got.a&&got.t) S.loaded = true; schedule(); };
  const onErr = e => { if (e && (e.code==='revoked'||e.code==='not_granted'||e.code==='capability_disabled')) { S.readOnly = true; } toast('The shared workspace stopped updating. Reload the page to reconnect.'); schedule(); };
  S.db.collection('orders').onSnapshot(snap => { const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id] = Object.assign({}, d.data(), {id:d.id}); }); S.orders=m; done('o'); }, onErr);
  S.db.collection('accounts').onSnapshot(snap => { const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id] = Object.assign({}, d.data(), {id:d.id}); }); S.accounts=m; done('a'); }, onErr);
  S.db.doc('config/team').onSnapshot(d => { S.team = d.exists ? (d.data().members||[]) : []; done('t'); }, onErr);
}
function write(coll, id, op, data){
  const path = coll==='config' ? 'config/team' : coll+'/'+id;
  if (S.readOnly) { toast('You can view this workspace but not change it.'); return Promise.resolve(false); }
  if (S.mode !== 'shared') {
    if (coll==='config') S.team = data.members;
    else if (op==='delete') delete S[coll][id];
    else if (op==='set') S[coll][id] = Object.assign({}, data, {id});
    else S[coll][id] = Object.assign({}, S[coll][id], data);
    saveLocal(); schedule(true); return Promise.resolve(true);
  }
  const body = data ? clone(data) : null; if (body) delete body.id;
  const run = async () => {
    const ref = S.db.doc(path);
    for (let attempt=0; attempt<2; attempt++){
      try { if(op==='set') await ref.set(body); else if(op==='update') await ref.update(body); else await ref.delete(); return true; }
      catch(e){
        const code = e && e.code;
        if (code==='unavailable' && attempt===0) { await new Promise(r=>setTimeout(r, 400+Math.random()*600)); continue; }
        if (code==='invalid_argument' && op!=='delete') { S.readOnly = true; toast('Your access to this workspace is view-only, so the change was not saved.'); }
        else if (code==='quota_exceeded') toast('The workspace is full. Remove closed or example orders, then try again.');
        else if (code==='resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');
        else toast('The change could not be saved. Check your connection and try again.');
        schedule(true); return false;
      }
    }
  };
  const p = (S.queues[path] || Promise.resolve()).then(run);
  S.queues[path] = p; return p;
}

const financeOwner = fallback => (S.team.find(m=>m.role==='Finance')||{}).name || fallback;
const acctOf = o => S.accounts[o.accountId] || {name:'(deleted account)', requirements:[], docRules:[], currency:'EUR'};

const stageDef = n => STAGES[n-1];
const docOk = (o,t) => DOC_OK.includes(((o.docs||{})[t]||{}).status);
const preShipMissing = o => (o.reqDocs||[]).filter(t => !POST_SHIP_DOCS.includes(t) && !docOk(o,t));

function genTasks(o, n, start){
  const s = stageDef(n); const anchor = {5:3,6:2,7:1}[n];
  return s.tasks.map(([title, off]) => {
    let due = addDays(start, off);
    if (anchor && o.shipBy) { const lim = addDays(o.shipBy, -anchor); if (lim < due) due = lim < start ? start : lim; }
    return { id: uid(), stage:n, title, owner: s.fin ? financeOwner(o.owner) : o.owner, due, status:'open' };
  });
}
function logTo(o, text, who){ o.activity = o.activity || []; o.activity.unshift({at:new Date().toISOString(), who: who || UI.me || 'Someone', text}); if (o.activity.length>150) o.activity.length = 150; o.lastActivity = today(); }

function gateBlockers(o){
  const b = []; const n = o.stage;
  const open = (o.tasks||[]).filter(t=>t.stage===n && t.status!=='done').length;
  if (open) b.push(`${open} task${open>1?'s':''} still open`);
  const sh = o.shipment||{};
  if (n===5 && (!sh.forwarder || !sh.eta)) b.push('Forwarder and ETA must be recorded');
  if (n===6) { const m = preShipMissing(o); if (m.length) b.push('Missing: '+m.join(', ')); }
  if (n===7) { const hi = allExc(o).filter(x=>OPEN_EXC.includes(x.status) && SEV[x.severity]>=3); if (hi.length) b.push(`${hi.length} High/Critical exception${hi.length>1?'s':''} open`); }
  if (n===8 && SHIP_STATUSES.indexOf(sh.status||'Not booked') < 3) b.push('Shipment status must be Departed or later');
  if (n===9) { if (sh.status!=='Delivered') b.push('Shipment not marked Delivered'); if (!docOk(o,'Proof of delivery (POD)')) b.push('POD not received'); }
  if (n===10 && !(o.finance||{}).invoiceNo) b.push('Customer invoice number not recorded');
  if (n===11 && !(o.finance||{}).supplierInvoiceNo) b.push('Supplier invoice number not recorded');
  if (n===12) { const ex = allExc(o).filter(x=>OPEN_EXC.includes(x.status)); if (ex.length) b.push(`${ex.length} exception${ex.length>1?'s':''} still open`); }
  return b;
}
function advanceStage(o, note){
  const n = o.stage; const t = today();
  o.stageDates = o.stageDates || {}; o.stageDates[n] = Object.assign({}, o.stageDates[n], {done:t});
  logTo(o, `Stage ${n} ${stageDef(n).name} complete: ${stageDef(n).out}${note?' ('+note+')':''}`);
  if (n === 12) { o.status = 'Closed'; o.closedAt = t; return; }
  o.stage = n+1; o.stageDates[n+1] = {start:t};
  o.tasks = (o.tasks||[]).concat(genTasks(o, n+1, t));
  logTo(o, `Stage ${n+1} ${stageDef(n+1).name} started, ${stageDef(n+1).tasks.length} tasks created`, 'System');
}

function detect(o){
  if (o.status !== 'Open') return [];
  const out = []; const t = today(); const st = ((o.stageDates||{})[o.stage]||{}).start; const sh = o.shipment||{};
  const miss = preShipMissing(o);
  if (o.stage>=5 && o.stage<=7 && miss.length && o.shipBy) {
    const d = diffDays(t, o.shipBy);
    if (d <= 3) out.push({code:'DOC_MISSING', title:`Missing before ship date: ${miss.join(', ')}`, severity: d<=1?'Critical':'High', due: d>1 ? addDays(o.shipBy,-1) : t});
  }
  if (o.stage===3 && st) { const n = diffDays(st, t); const acc = (o.tasks||[]).find(x=>x.stage===3 && /acceptance/.test(x.title)); if (n>=2 && acc && acc.status!=='done') out.push({code:'SUPP_NORESP', title:`No acceptance from ${o.supplier||'supplier'} after ${n} days`, severity: n>=4?'High':'Medium', due:t}); }
  if (o.stage<=7 && o.shipBy && t > o.shipBy) out.push({code:'SHIPBY_MISSED', title:`Ship-by date ${fmtDate(o.shipBy)} passed and the order has not shipped`, severity:'High', due:t});
  if (o.stage>=5 && o.stage<=9 && sh.eta && o.requested && sh.eta > o.requested && sh.status!=='Delivered') out.push({code:'SHIP_DELAY', title:`ETA ${fmtDate(sh.eta)} is after requested delivery ${fmtDate(o.requested)}`, severity: o.accountType==='Airline'?'Critical':'High', due:t});
  if (o.stage===9 && sh.status==='Delivered' && !docOk(o,'Proof of delivery (POD)') && sh.delivered && diffDays(sh.delivered,t)>=3) out.push({code:'POD_MISSING', title:`No POD ${diffDays(sh.delivered,t)} days after delivery`, severity:'Medium', due:t});
  if (o.stage===10 && st && diffDays(st,t)>=3) out.push({code:'INV_OVERDUE', title:`Delivered ${diffDays(st,t)} days ago and not yet invoiced`, severity:'Medium', due:t});
  if (o.lastActivity && diffDays(o.lastActivity, t) >= 5) out.push({code:'ORDER_IDLE', title:`No activity for ${diffDays(o.lastActivity,t)} days`, severity:'Low', due:addDays(t,2)});
  return out;
}
function allExc(o){
  const stored = (o.exceptions||[]).map(x => Object.assign({}, x, {orderId:o.id}));
  const byId = new Map(stored.map(x=>[x.id,x]));
  const live = new Set();
  for (const d of detect(o)) {
    const id = 'auto-'+d.code; live.add(id);
    const s = byId.get(id);
    if (s) { if (s.status!=='Resolved') { s.title = d.title; if (SEV[d.severity] > SEV[s.severity]) s.severity = d.severity; } }
    else stored.push({id, code:d.code, title:d.title, severity:d.severity, owner:o.owner, due:d.due, status:'Open', raisedAt:null, raisedBy:'System', auto:true, virtual:true, orderId:o.id});
  }
  stored.forEach(x => { if (x.auto && !live.has(x.id) && OPEN_EXC.includes(x.status)) x.cleared = true; });
  return stored;
}
function escLevel(x){
  let l = x.level || 0; if (!OPEN_EXC.includes(x.status)) return l;
  const t = today();
  if (x.status==='Open' && x.raisedAt && (Date.now()-new Date(x.raisedAt).getTime()) > 4*3600e3) l = Math.max(l,1);
  if (x.due && x.due < t) l = Math.max(l,2);
  if (x.due && diffDays(x.due, t) >= 2) l = Math.max(l,3);
  return l;
}
function isLate(o){ if (o.status!=='Open' && o.status!=='On hold') return false; if (o.stage>9) return false; const t=today(); const eta=(o.shipment||{}).eta; return (o.requested && t>o.requested) || (eta && o.requested && eta>o.requested && (o.shipment||{}).status!=='Delivered'); }
function health(o){
  if (o.status==='Closed' || o.status==='Cancelled') return 'done';
  const ex = allExc(o).filter(x=>OPEN_EXC.includes(x.status) && !x.cleared);
  const t = today();
  const cur = (o.tasks||[]).filter(x=>x.stage===o.stage && x.status!=='done');
  if (ex.some(x=>SEV[x.severity]>=3) || cur.some(x=>x.due<t) || isLate(o)) return 'red';
  if (ex.some(x=>x.severity==='Medium') || cur.some(x=>diffDays(t,x.due)<=1) || o.status==='On hold') return 'amber';
  return 'green';
}
function allOpenExc(){ const r=[]; openOrders().forEach(o=>allExc(o).forEach(x=>{ if(OPEN_EXC.includes(x.status)) r.push(x); })); return r; }
function allOpenTasks(){ const r=[]; openOrders().forEach(o=>(o.tasks||[]).forEach(t=>{ if(t.status!=='done' && t.stage===o.stage) r.push(Object.assign({orderId:o.id}, t)); })); return r; }

function mutateOrder(id, fn){

  const o = clone(cur); fn(o); o.updated = new Date().toISOString();
  const patch = {}; Object.keys(o).forEach(k => { if (k!=='id' && JSON.stringify(o[k]) !== JSON.stringify(cur[k])) patch[k] = o[k]; });
  if (Object.keys(patch).length) return write('orders', id, 'update', patch);

function persistExc(o, x){

    if (aOver!==bOver) return aOver-bOver; if (a.sort[1]!==b.sort[1]) return a.sort[1]-b.sort[1]; return String(ao).localeCompare(String(bo)); });

}

  const open = openOrders().filter(inScope);
  const t = today();
  const late = open.filter(isLate);
  const withExc = open.filter(o=>allExc(o).some(x=>OPEN_EXC.includes(x.status)&&!x.cleared));
  const missDocs = open.filter(o=>o.stage>=6 && o.stage<=8 && preShipMissing(o).length);
  const transit = open.filter(o=>o.stage===8 || (o.stage===9 && (o.shipment||{}).status!=='Delivered'));
  const delayed = transit.filter(o=>allExc(o).some(x=>x.code==='SHIP_DELAY'&&OPEN_EXC.includes(x.status)));
  const awaitInv = open.filter(o=>o.stage===10);
  const pendBill = awaitInv.reduce((s,o)=>s+(o.value||0),0);
  const oldestInv = awaitInv.reduce((m,o)=>Math.max(m, diffDays(((o.stageDates||{})[10]||{}).start||t, t)),0);
  const crit = [];
  open.forEach(o=>allExc(o).forEach(x=>{ if(OPEN_EXC.includes(x.status) && SEV[x.severity]>=3) crit.push(x); }));
  crit.sort((a,b)=>SEV[b.severity]-SEV[a.severity] || String(a.due).localeCompare(String(b.due)));
  const delivered = ordersArr().filter(inScope).filter(o=>(o.shipment||{}).delivered && diffDays((o.shipment||{}).delivered,t)<=90);
  const otif = delivered.length ? Math.round(delivered.filter(o=>o.shipment.delivered<=o.requested).length/delivered.length*1000)/10 : null;
  const pct = (a,b)=> b? Math.round(a/b*1000)/10 : 0;
  const lateP = pct(late.length, open.length), excP = pct(withExc.length, open.length);
  const tone = (v,g,a) => v<=g?'t-ok':v<=a?'t-warn':'t-bad';
  const tile = (label,val,sub,cls,go) => `<button class="tile ${cls}" ${go?`data-act="goto-orders" data-f="${go}"`:''}><span class="k">${label}</span><span class="v">${val}</span><span class="s">${sub}</span></button>`;
  const byStage = STAGES.map(s=>{ const os = open.filter(o=>o.stage===s.n); const lateN = os.filter(o=>{ const sd=((o.stageDates||{})[s.n]||{}); return (o.tasks||[]).some(x=>x.stage===s.n&&x.status!=='done'&&x.due<t); }).length; return [s, os.length, lateN]; });
  const maxS = Math.max(1, ...byStage.map(x=>x[1]));
  const excByType = {}; open.forEach(o=>allExc(o).forEach(x=>{ if(OPEN_EXC.includes(x.status)) excByType[x.code]=(excByType[x.code]||0)+1; }));
  const excRows = Object.entries(excByType).sort((a,b)=>b[1]-a[1]); const maxE = Math.max(1,...excRows.map(r=>r[1]));
  const load = S.team.filter(m=>m.role!=='Viewer').map(m=>{ const ts = allOpenTasks().filter(x=>x.owner===m.name); return [m.name, ts.length, ts.filter(x=>x.due<t).length]; }).sort((a,b)=>b[1]-a[1]);
  const maxL = Math.max(1,...load.map(l=>l[1]));
  const regions = [...new Set(Object.values(S.accounts).map(a=>a.region).filter(Boolean))];
  const acctRisk = Object.values(S.accounts).map(a=>{ const os=open.filter(o=>o.accountId===a.id); return [a, os.length, os.filter(o=>health(o)==='red').length, os.reduce((s,o)=>s+(o.value||0),0)]; }).filter(r=>r[1]).sort((a,b)=>b[2]-a[2]||b[3]-a[3]);
  return `
  <div class="spread"><div><div class="eyebrow">Operations leadership</div><h1>Executive dashboard</h1></div>
    <div class="row">
      <select class="f inline" data-chg="dash-f" data-k="type" aria-label="Account type"><option value="">All account types</option>${ACCOUNT_TYPES.map(x=>`<option ${f.type===x?'selected':''}>${x}</option>`).join('')}</select>
      <select class="f inline" data-chg="dash-f" data-k="region" aria-label="Region"><option value="">All regions</option>${regions.map(x=>`<option ${f.region===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
    </div></div>
  <div class="tiles">
    ${tile('Open orders',open.length,`${kmoney(open.reduce((s,o)=>s+(o.value||0),0))} open value`,'t-info','open')}
    ${tile('Late orders',late.length,`${lateP}% of open`,tone(lateP,3,6),'late')}
    ${tile('With exceptions',withExc.length,`${excP}% of open`,tone(excP,10,20),'exc')}
    ${tile('Missing documents',missDocs.length,'orders in stages 6–8',missDocs.length?(missDocs.length>10?'t-bad':'t-warn'):'t-ok','docs')}
    ${tile('Shipments in transit',transit.length,`${delayed.length} delayed`,delayed.length?'t-bad':'t-info','transit')}
    ${tile('Awaiting invoice',awaitInv.length,awaitInv.length?`oldest ${oldestInv}d`:'none waiting',oldestInv>5?'t-bad':oldestInv>2?'t-warn':'t-ok','invoice')}
    ${tile('Revenue pending billing',kmoney(pendBill),'delivered, not invoiced',pendBill?'t-warn':'t-ok','invoice')}
    ${tile('Critical risks',crit.filter(x=>x.severity==='Critical').length,`${crit.length} high or critical`,crit.some(x=>x.severity==='Critical')?'t-bad':crit.length?'t-warn':'t-ok','')}
    ${tile('OTIF (90 days)',otif==null?'—':otif+'%',`${delivered.length} deliveries · target 96%`,otif==null?'':otif>=96?'t-ok':otif>=92?'t-warn':'t-bad','')}
  </div>
  <div class="cols">
    <section class="panel"><div class="hd"><h2>Orders by stage</h2><div class="legend"><span><i style="background:var(--info)"></i>On track</span><span><i style="background:var(--bad)"></i>With overdue tasks</span></div></div>
      <div class="bd"><div class="bars">${byStage.map(([s,n,l])=>`<div class="bar" title="${n} orders, ${l} with overdue tasks"><span class="lbl">${s.n}. ${esc(s.name)}</span><span class="trk"><span class="fill" style="width:${(n-l)/maxS*100}%"></span><span class="fill late" style="width:${l/maxS*100}%"></span></span><span class="val">${n}</span></div>`).join('')}</div></div></section>
    <section class="panel"><div class="hd"><h2>Critical risks</h2><button class="link" data-act="nav" data-v="exceptions">All exceptions</button></div>
      <div class="items">${crit.length? crit.slice(0,8).map(x=>{ const o=S.orders[x.orderId]; return `<div class="item sev sev-${x.severity}"><div class="body"><div class="ttl">${esc(x.title)}</div><div class="meta"><button class="link" data-act="open-order" data-o="${o.id}">${esc(o.no)}</button><span>${esc(acctOf(o).name)}</span><span>${esc(x.owner||'Unowned')}</span><span class="badge ${sevCls(x.severity)}">${x.severity}</span>${escLevel(x)?`<span class="badge b-crit">L${escLevel(x)}</span>`:''}</div></div></div>`; }).join('') : '<div class="empty">No high or critical exceptions open.</div>'}</div></section>

    <section class="panel"><div class="hd"><h2>Accounts at risk</h2></div><div class="bd flush"><div class="tbl-wrap"><table class="t"><thead><tr><th>Account</th><th>Open</th><th>Red</th><th>Value</th></tr></thead><tbody>${acctRisk.slice(0,6).map(([a,n,r,v])=>`<tr class="click" data-act="open-account" data-a="${a.id}"><td>${esc(a.name)}</td><td class="num">${n}</td><td class="num">${r?`<span class="badge b-bad">${r}</span>`:'0'}</td><td class="num">${kmoney(v)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No open orders.</td></tr>'}</tbody></table></div></div></section>

  </div>`;
}

function orderFilterFn(k){
  const t = today();
  return ({
    open:o=>o.status==='Open'||o.status==='On hold', mine:o=>(o.status==='Open'||o.status==='On hold')&&o.owner===UI.me,
    late:isLate, risk:o=>health(o)==='red', exc:o=>(o.status==='Open'||o.status==='On hold')&&allExc(o).some(x=>OPEN_EXC.includes(x.status)&&!x.cleared),
    docs:o=>o.status==='Open'&&o.stage>=6&&o.stage<=8&&preShipMissing(o).length>0,
    transit:o=>o.status==='Open'&&(o.stage===8||(o.stage===9&&(o.shipment||{}).status!=='Delivered')),
    invoice:o=>o.status==='Open'&&o.stage===10, hold:o=>o.status==='On hold', closed:o=>o.status==='Closed'||o.status==='Cancelled'
  })[k] || (o=>o.status==='Open'||o.status==='On hold');
}
function viewOrders(){
  const f = UI.filters.orders || {view:'open'};
  const views = [['open','All open'],['mine','My orders'],['late','Late'],['risk','At risk'],['exc','With exceptions'],['docs','Missing docs'],['transit','In transit'],['invoice','Awaiting invoice'],['hold','On hold'],['closed','Closed']];
  let list = ordersArr().filter(orderFilterFn(f.view));
  if (f.acct) list = list.filter(o=>o.accountId===f.acct);
  if (f.owner) list = list.filter(o=>o.owner===f.owner);
  const hRank = {red:0,amber:1,green:2,done:3};
  list.sort((a,b)=> hRank[health(a)]-hRank[health(b)] || String(a.shipBy).localeCompare(String(b.shipBy)));
  UI.lastOrderList = list.map(o=>o.id);
  return `

function ownerOptions(cur){ const names = teamNames(); return (cur && !names.includes(cur) ? `<option selected>${esc(cur)}</option>` : (!cur?'<option value="" selected>Unassigned</option>':'')) + names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join(''); }

function viewExceptions(){
  const f = UI.filters.exc || 'open'; const t = today();
  const every = []; ordersArr().forEach(o=>allExc(o).forEach(x=>every.push(x)));
  const preds = { open:x=>OPEN_EXC.includes(x.status), mine:x=>OPEN_EXC.includes(x.status)&&x.owner===UI.me, escalated:x=>OPEN_EXC.includes(x.status)&&escLevel(x)>=1,
    overdue:x=>OPEN_EXC.includes(x.status)&&x.due&&x.due<t, unowned:x=>OPEN_EXC.includes(x.status)&&(!x.owner||!teamNames().includes(x.owner)),
    resolved:x=>x.status==='Resolved' && x.resolvedAt && diffDays(x.resolvedAt.slice(0,10),t)<=30 };
  const list = every.filter(preds[f]||preds.open);
  const chips = [['open','Open'],['mine','Mine'],['escalated','Escalated'],['overdue','Past due'],['unowned','Unowned'],['resolved','Resolved (30 days)']];
  const openAll = every.filter(preds.open);
  const ages = openAll.filter(x=>x.raisedAt).map(x=>diffDays(x.raisedAt.slice(0,10),t));
  const avgAge = ages.length? (ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1) : '0';
  const groups = f==='resolved' ? [['Resolved', list]] : SEVS.map(s=>[s, list.filter(x=>x.severity===s)]).filter(g=>g[1].length);
  return `
  <div class="spread"><div><div class="eyebrow">Exception engine</div><h1>Exceptions</h1><div class="muted">${openAll.length} open · average age ${avgAge} days · ${openAll.filter(x=>x.due&&x.due<t).length} past due · auto-detected issues appear and clear on their own</div></div>
    <button class="btn pri" data-act="raise-exc">+ Raise exception</button></div>
  <div class="chips">${chips.map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="filter" data-k="exc" data-v="${k}">${l}<span class="n">${every.filter(preds[k]).length}</span></button>`).join('')}</div>
  ${groups.length? groups.map(([g,xs])=>`<section class="panel"><div class="hd"><h2>${g} <span class="muted num">(${xs.length})</span></h2></div><div class="items">${xs.sort((a,b)=>String(a.due).localeCompare(String(b.due))).map(excRow).join('')}</div></section>`).join('')
    : '<section class="panel"><div class="empty"><b>No exceptions in this view.</b><span>Good. The engine keeps checking documents, dates, suppliers, shipments and invoices.</span></div></section>'}`;
}
function excRow(x){

    <div class="ttl">${esc(EXC_TYPES[x.code]?.[0]||x.code)}: ${esc(x.title)}</div>

      ${open?`<select class="f inline" data-chg="exc-owner" data-o="${o.id}" data-x="${x.id}" aria-label="Owner">${ownerOptions(x.owner)}</select>`:`<span>${esc(x.owner)}</span>`}
      <span class="badge ${sevCls(x.severity)}">${x.severity}</span>${open?`<span class="badge ${dueCls(x.due)}">${relDue(x.due)}</span>`:''}

    <div class="acts">${open?`${x.status==='Open'?`<button class="btn sm" data-act="exc-ack" data-o="${o.id}" data-x="${x.id}">Acknowledge</button>`:''}<button class="btn sm" data-act="exc-escalate" data-o="${o.id}" data-x="${x.id}">Escalate</button><button class="btn sm pri" data-act="exc-resolve" data-o="${o.id}" data-x="${x.id}">Resolve</button>`:`<button class="btn sm" data-act="exc-reopen" data-o="${o.id}" data-x="${x.id}">Reopen</button>`}</div></div>`;
}

function shipLine(sh){
  const idx = SHIP_STATUSES.indexOf(sh.status||'Not booked');
  const pts = ['Booked','Collected','Departed','Arrived','Customs','Delivered'];
  const dates = {Booked:null, Collected:sh.collection, Departed:sh.etd, Arrived:sh.eta, Delivered:sh.delivered};
  return `<div class="shipline">${pts.map(p=>{ const pi = SHIP_STATUSES.indexOf(p); const on = idx>pi || (idx===pi && p==='Delivered'); const now = idx===pi && p!=='Delivered' || (p==='Departed'&&idx===4);
    return `<div class="sp ${on||now?'on':''} ${now?'now':''}"><i></i><span>${p}</span><span class="faint num">${dates[p]?fmtDate(dates[p]):''}</span></div>`; }).join('')}</div>`;
}
function viewShipments(){

    ['Collecting in the next 7 days', rel.filter(o=>sh(o).collection && sh(o).collection>=t && diffDays(t,sh(o).collection)<=7 && SHIP_STATUSES.indexOf(sh(o).status||'Not booked')<2)],
    ['In transit', rel.filter(o=>['Collected','Departed','In transit','Arrived','Customs'].includes(sh(o).status))],

      <div class="meta"><span>${esc(s.mode||o.mode||'')}</span><span>${esc(s.forwarder||'No forwarder')}</span><span class="mono">${esc(s.ref||'')}</span><span class="badge ${s.status==='Delivered'?'b-ok':'b-info'}">${esc(s.status||'Not booked')}</span></div></div>

function viewReports(){
  const t = today(); const all = ordersArr();
  const closed = all.filter(o=>o.status==='Closed' && o.closedAt);
  const cyc = closed.map(o=>diffDays(o.created.slice(0,10), o.closedAt));
  const avgCyc = cyc.length ? Math.round(cyc.reduce((a,b)=>a+b,0)/cyc.length) : null;
  const stageDur = STAGES.map(s=>{ const ds = all.map(o=>(o.stageDates||{})[s.n]).filter(d=>d&&d.start&&d.done).map(d=>diffDays(d.start,d.done)); return [s, ds.length? ds.reduce((a,b)=>a+b,0)/ds.length : 0, ds.length]; });
  const maxSD = Math.max(1, ...stageDur.map(x=>x[1]));
  const deliv = all.filter(o=>(o.shipment||{}).delivered);
  const onTime = deliv.filter(o=>o.shipment.delivered<=o.requested).length;
  const firstRight = closed.filter(o=>!(o.exceptions||[]).length).length;
  const last90 = all.filter(o=>o.created && diffDays(o.created.slice(0,10),t)<=90).length;
  const invoiced = all.filter(o=>(o.finance||{}).invoiceNo);
  const revByCust = {}; invoiced.forEach(o=>{ const n=acctOf(o).name; revByCust[n]=(revByCust[n]||0)+((o.finance||{}).invoiceAmount||o.value||0); });
  const custRows = Object.entries(revByCust).sort((a,b)=>b[1]-a[1]); const maxC = Math.max(1,...custRows.map(r=>r[1]));
  const months = []; for (let i=5;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(d.getFullYear()+'-'+z(d.getMonth()+1)); }
  const revByMonth = months.map(m=>[m, invoiced.filter(o=>((o.finance||{}).invoiceDate||'').startsWith(m)).reduce((s,o)=>s+((o.finance||{}).invoiceAmount||o.value||0),0)]);
  const maxM = Math.max(1,...revByMonth.map(r=>r[1]));
  const pendInv = openOrders().filter(o=>o.stage===10);
  const buckets = [['0–2 days',0,2],['3–5 days',3,5],['6–10 days',6,10],['10+ days',11,9999]].map(([l,a,b])=>[l, pendInv.filter(o=>{ const d=diffDays(((o.stageDates||{})[10]||{}).start||t,t); return d>=a&&d<=b; }).reduce((s,o)=>s+(o.value||0),0)]);
  const openVal = PHASES.map(p=>[p, openOrders().filter(o=>stageDef(o.stage).phase===p).reduce((s,o)=>s+(o.value||0),0)]);
  const maxOV = Math.max(1,...openVal.map(r=>r[1]));
  const sup = {}; all.forEach(o=>{ const k=o.supplier||'Unknown'; sup[k]=sup[k]||{orders:0,exc:0,shipped:0,onTime:0,docExc:0,noresp:0};
    const s=sup[k]; s.orders++; const ex=o.exceptions||[]; s.exc+=ex.length; s.docExc+=ex.filter(x=>/^DOC/.test(x.code)).length; s.noresp+=ex.filter(x=>x.code==='SUPP_NORESP'||x.code==='SUPP_DELAY').length;
    const col=(o.shipment||{}).collection; if(col && o.stage>=8){ s.shipped++; if(col<=o.shipBy) s.onTime++; } });
  const supRows = Object.entries(sup).sort((a,b)=>b[1].orders-a[1].orders);
  const pct = (a,b)=> b? Math.round(a/b*100)+'%' : '—';
  return `<div class="spread"><div><div class="eyebrow">Insights</div><h1>Reports</h1></div></div>
  <h2>Operational performance</h2>
  <div class="tiles">
    <div class="tile t-info"><span class="k">Orders received (90d)</span><span class="v">${last90}</span></div>
    <div class="tile t-info"><span class="k">Orders closed</span><span class="v">${closed.length}</span></div>
    <div class="tile ${avgCyc==null?'':avgCyc<=45?'t-ok':'t-warn'}"><span class="k">Avg cycle time</span><span class="v">${avgCyc==null?'—':avgCyc+'d'}</span><span class="s">PO to closure</span></div>
    <div class="tile ${deliv.length&&onTime/deliv.length>=.96?'t-ok':'t-warn'}"><span class="k">On-time delivery</span><span class="v">${pct(onTime,deliv.length)}</span><span class="s">${deliv.length} deliveries</span></div>
    <div class="tile"><span class="k">First-time right</span><span class="v">${pct(firstRight,closed.length)}</span><span class="s">closed with no exceptions</span></div>
  </div>
  <section class="panel"><div class="hd"><h2>Average days per stage</h2><span class="muted">the longest bar is the bottleneck</span></div><div class="bd"><div class="bars">${stageDur.map(([s,d,n])=>`<div class="bar" title="${n} orders measured"><span class="lbl">${s.n}. ${esc(s.name)}</span><span class="trk"><span class="fill" style="width:${d/maxSD*100}%"></span></span><span class="val">${d?d.toFixed(1):'–'}</span></div>`).join('')}</div></div></section>
  <h2>Financial metrics</h2>
  <div class="grid2">
    <section class="panel"><div class="hd"><h2>Revenue by month</h2><span class="muted">invoiced</span></div><div class="bd"><div class="bars">${revByMonth.map(([m,v])=>`<div class="bar"><span class="lbl">${new Date(m+'-15').toLocaleDateString(undefined,{month:'short',year:'numeric'})}</span><span class="trk"><span class="fill acc" style="width:${v/maxM*100}%"></span></span><span class="val">${kmoney(v)}</span></div>`).join('')}</div></div></section>
    <section class="panel"><div class="hd"><h2>Revenue by customer</h2><span class="muted">invoiced, all time</span></div><div class="bd"><div class="bars">${custRows.length? custRows.map(([c,v])=>`<div class="bar"><span class="lbl">${esc(c)}</span><span class="trk"><span class="fill acc" style="width:${v/maxC*100}%"></span></span><span class="val">${kmoney(v)}</span></div>`).join(''):'<span class="muted">No invoices yet.</span>'}</div></div></section>
    <section class="panel"><div class="hd"><h2>Pending invoicing by age</h2><span class="muted">${kmoney(pendInv.reduce((s,o)=>s+(o.value||0),0))} total</span></div><div class="bd"><div class="bars">${buckets.map(([l,v],i)=>`<div class="bar"><span class="lbl">${l}</span><span class="trk"><span class="fill ${i>=2?'late':''}" style="width:${v/Math.max(1,...buckets.map(b=>b[1]))*100}%"></span></span><span class="val">${kmoney(v)}</span></div>`).join('')}</div></div></section>
    <section class="panel"><div class="hd"><h2>Open order value by phase</h2></div><div class="bd"><div class="bars">${openVal.map(([p,v])=>`<div class="bar"><span class="lbl">${p}</span><span class="trk"><span class="fill" style="width:${v/maxOV*100}%"></span></span><span class="val">${kmoney(v)}</span></div>`).join('')}</div></div></section>
  </div>
  <h2>Supplier performance</h2>
  <section class="panel"><div class="bd flush"><div class="tbl-wrap"><table class="t"><thead><tr><th>Supplier</th><th>Orders</th><th>On-time collection</th><th>Document issues</th><th>Response / delay issues</th><th>Exceptions per order</th></tr></thead><tbody>
  ${supRows.map(([n,s])=>`<tr><td>${esc(n)}</td><td class="num">${s.orders}</td><td class="num">${pct(s.onTime,s.shipped)}</td><td class="num">${s.docExc}</td><td class="num">${s.noresp}</td><td class="num">${(s.exc/s.orders).toFixed(2)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No orders yet.</td></tr>'}
  </tbody></table></div></div></section>`;
}

// ---------- drawer ----------
function renderDrawer(scrollTop){
  const r = $('#drawerRoot');
  if (!UI.drawer) { r.innerHTML=''; return; }
  let html = '';
  if (UI.drawer.type==='order') { const o = S.orders[UI.drawer.id]; if (!o) { UI.drawer=null; r.innerHTML=''; return; } html = drawerOrder(o); }
  else if (UI.drawer.type==='account') { const a = S.accounts[UI.drawer.id]; if (!a) { UI.drawer=null; r.innerHTML=''; return; } html = drawerAccount(a); }
  r.innerHTML = `<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;
  const db = r.querySelector('.db'); if (db && scrollTop) db.scrollTop = scrollTop;
}
function fieldInput(o, path, type, label, opts){
  const v = getPath(o, path) ?? '';
  if (type==='select') return `<label class="fl">${label}<select class="f" data-chg="of" data-o="${o.id}" data-f="${path}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;
  return `<label class="fl">${label}<input class="f ${type==='number'?'num':''}" type="${type}" value="${esc(v)}" data-chg="of" data-o="${o.id}" data-f="${path}"></label>`;
}
function drawerOrder(o){

function parseLines(txt, a){
  return txt.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p = l.split(/\t|\s*\|\s*|\s*;\s*|\s*,\s*(?=\S)/).map(x=>x.trim()).filter(x=>x!=='');
    if (p.length < 3) return null;
    const nums = p.slice(1).filter(x=>/^[\d.]+$/.test(x.replace(/[€$£,\s]/g,'')));
    const qty = parseFloat((nums[0]||'0').replace(/[^\d.]/g,'')); const price = parseFloat((nums[1]||'').replace(/[^\d.]/g,'')) || (a.priceList||{})[p[0]] || 0;
    const name = p.slice(1).filter(x=>!nums.includes(x)).join(' ') || p[0];
    return {sku:p[0], name, qty, price, listPrice:(a.priceList||{})[p[0]]||null};
  }).filter(l=>l && l.qty>0);
}
function nextOrderNo(){

    if (stage>=12) { o.finance.supplierInvoiceNo = 'SI-'+(90210+idx); o.finance.supplierAmount = Math.round(o.value*0.72); setDoc('Supplier invoice','Received', addDays(o.finance.invoiceDate,3)); }
    o.cost = Math.round(o.value*0.72);
    if (extra.exc) { const e = extra.exc; o.exceptions.push({id:uid(), code:e.code, title:e.title, severity:e.severity, owner:o.owner, due:addDays(t,1), status:'Acknowledged', raisedAt:addDays(t,-e.ago)+'T08:30:00.000Z', raisedBy:o.owner}); o.activity.unshift({at:addDays(t,-e.ago)+'T08:30:00.000Z', who:o.owner, text:`Exception raised: ${EXC_TYPES[e.code][0]}: ${e.title}`}); }
    if (extra.excResolved) o.exceptions.push({id:uid(), code:'DOC_ERROR', title:'Commercial invoice missing airline PO number', severity:'Medium', owner:o.owner, due:addDays(t,-30), status:'Resolved', raisedAt:addDays(t,-31)+'T08:00:00.000Z', raisedBy:o.owner, resolution:'Document reissued', rootCause:'Internal error', resolvedAt:addDays(t,-30)+'T12:00:00.000Z'});
    if (extra.closed) { o.tasks.forEach(x=>{ if(x.status!=='done'){ x.status='done'; x.doneBy=x.owner; x.doneAt=curStart; } }); o.stageDates[12].done = curStart; o.status='Closed'; o.closedAt = curStart; o.activity.unshift({at:curStart+'T16:00:00.000Z', who:o.owner, text:'Stage 12 Order Closure complete: Order closed'}); }
    o.lastActivity = extra.closed ? curStart : addDays(t, -Math.min(curAgo,2));
    o.updated = now;
    orders['ex-o'+(no)] = Object.assign(o, {id:'ex-o'+no});
  });
  return {team, accounts, orders};
}

const q = $('#q'), qres = $('#qres'); let qSel = 0, qItems = [];
function runSearch(){
  const s = q.value.trim().toLowerCase(); if (!s) { qres.hidden = true; return; }
  const hits = [];
  ordersArr().forEach(o=>{ const hay = [o.no,o.customerPo,acctOf(o).name,o.supplier,o.destination,(o.shipment||{}).ref,(o.finance||{}).invoiceNo,(o.lines||[]).map(l=>l.sku+' '+l.name).join(' ')].join(' ').toLowerCase(); if (hay.includes(s)) hits.push({t:'o', o}); });
  Object.values(S.accounts).forEach(a=>{ if ((a.name+' '+(a.destinations||[]).join(' ')).toLowerCase().includes(s)) hits.push({t:'a', a}); });
  qItems = hits.slice(0,10); qSel = 0;
  qres.innerHTML = qItems.length ? qItems.map((h,i)=> h.t==='o'
    ? `<button class="${i===qSel?'hi':''}" data-act="open-order" data-o="${h.o.id}"><span class="dot d-${health(h.o)}"></span><span class="mono">${esc(h.o.no)}</span><span>${esc(acctOf(h.o).name)}</span><span class="muted" style="margin-left:auto;font-size:12px">PO ${esc(h.o.customerPo)} · ${h.o.status==='Open'?'stage '+h.o.stage:esc(h.o.status)}</span></button>`
    : `<button class="${i===qSel?'hi':''}" data-act="open-account" data-a="${h.a.id}">${icon('acct',14)}<span>${esc(h.a.name)}</span><span class="muted" style="margin-left:auto;font-size:12px">Account</span></button>`).join('')
    : `<div class="muted" style="padding:10px 12px">No orders or accounts match “${esc(q.value)}”.</div>`;
  qres.hidden = false;
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', runSearch);
q.addEventListener('keydown', e => {
  if (e.key==='Escape') { q.value=''; qres.hidden=true; q.blur(); }
  if (e.key==='ArrowDown' || e.key==='ArrowUp') { e.preventDefault(); if(!qItems.length) return; qSel = (qSel + (e.key==='ArrowDown'?1:-1) + qItems.length) % qItems.length; [...qres.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('hi', i===qSel)); }
  if (e.key==='Enter' && qItems[qSel]) { const h=qItems[qSel]; UI.drawer = h.t==='o'?{type:'order',id:h.o.id}:{type:'account',id:h.a.id}; qres.hidden=true; q.blur(); render(); }
});

  if (e.key==='Escape' && !q.matches(':focus')) { if ($('#modalRoot').innerHTML) closeModal(); else if (UI.drawer) { UI.drawer=null; render(); } }
});
// refresh time-based rules (overdue, escalations) every 5 minutes without writing anything
setInterval(()=>schedule(), 5*60*1000);
